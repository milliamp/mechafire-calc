<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mecha Fire - Resource Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@300;400;600&display=swap');
  :root {
    --bg: #181b2e;
    --bg-gradient: radial-gradient(ellipse at 50% 0%, rgba(6,186,186,0.08) 0%, #181b2e 60%);
    --surface: #22253B;
    --surface2: #575D85;
    --accent: #06BABA;
    --accent-glow: rgba(6, 186, 186, 0.3);
    --accent2: #3B9AE4;
    --danger: #f87171;
    --success: #4ade80;
    --gold: #f0a500;
    --rarity-r: #5B8FD4;
    --rarity-sr: #B44CD0;
    --rarity-ssr: #E8943A;
    --text: #DADAD9;
    --text-bright: #fff;
    --text-dim: #8a8faa;
    --border: rgba(87, 93, 133, 0.4);
    --border-accent: rgba(6, 186, 186, 0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Exo 2', 'Helvetica Neue', system-ui, sans-serif;
    background: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .app-header {
    text-align: center;
    margin-bottom: 20px;
    padding: 16px 0 12px;
  }
  .app-header::after {
    content: '';
    display: block;
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 12px auto 0;
  }
  h1 {
    font-family: 'Orbitron', monospace;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 6px;
    color: var(--text-bright);
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(6,186,186,0.1);
  }
  h1 .brand-accent { color: var(--accent); }
  .subtitle {
    font-family: 'Exo 2', sans-serif;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    font-weight: 300;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── Tabs ── */
  .tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .tab-btn {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    font-weight: 500;
    padding: 10px 18px;
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--text); border-color: var(--accent2); }
  .tab-btn.active {
    color: var(--accent);
    border-color: var(--accent);
    border-bottom-color: var(--bg);
    background: var(--bg);
    text-shadow: 0 0 10px var(--accent-glow);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Summary bar (reused per tab) ── */
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .summary-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--card-color, var(--accent)), transparent);
  }
  .summary-card .label {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }
  .summary-card .value {
    font-family: 'Orbitron', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent-glow);
  }

  /* ── Card grid (shared) ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover { border-color: var(--accent2); }
  .card.active {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow), inset 0 1px 0 rgba(6,186,186,0.1);
  }
  .card-title {
    font-family: 'Orbitron', monospace;
    font-weight: 500;
    font-size: 0.8rem;
    margin-bottom: 10px;
    color: var(--text-bright);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .ctrl-row label {
    font-size: 0.8rem;
    color: var(--text-dim);
    width: 60px;
    flex-shrink: 0;
  }
  .ctrl-row select {
    flex: 1;
    padding: 6px 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .ctrl-row select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .card-cost {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 6px;
    min-height: 1.2em;
  }
  .card-cost span { color: var(--accent); font-weight: 600; font-family: 'Orbitron', monospace; font-size: 0.75rem; }

  /* ── Prereqs ── */
  .prereqs {
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
    padding-top: 6px;
  }
  .prereq-line {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    border-radius: 3px;
    padding: 2px 4px;
    transition: background 0.15s;
  }
  .prereq-line:hover { background: rgba(255,255,255,0.05); }
  .prereq-met { color: var(--success); }
  .prereq-unmet { color: var(--danger); font-weight: 600; }
  .prereq-indicator {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .prereq-met .prereq-indicator { background: var(--success); box-shadow: 0 0 4px rgba(74,222,128,0.4); }
  .prereq-unmet .prereq-indicator { background: var(--danger); box-shadow: 0 0 4px rgba(248,113,113,0.4); }

  /* Blocker cards */
  .card.blocker {
    border-color: var(--danger);
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.3);
  }
  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 8px rgba(248, 113, 113, 0.2); }
    50% { box-shadow: 0 0 16px rgba(248, 113, 113, 0.5); }
  }
  .card.blocker { animation: pulse-border 2s ease-in-out infinite; }

  /* ── Actions bar ── */
  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .actions button, .btn {
    font-family: 'Orbitron', monospace;
    padding: 7px 16px;
    background: linear-gradient(180deg, rgba(6,186,186,0.15) 0%, rgba(6,186,186,0.05) 100%);
    color: var(--accent);
    border: 1px solid var(--border-accent);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.65rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .actions button:hover, .btn:hover {
    background: linear-gradient(180deg, rgba(6,186,186,0.25) 0%, rgba(6,186,186,0.1) 100%);
    box-shadow: 0 0 12px var(--accent-glow);
    border-color: var(--accent);
  }
  .actions select {
    padding: 6px 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'Exo 2', sans-serif;
  }
  .actions label {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ── Build order ── */
  .build-order-section { margin-top: 28px; }
  .build-order-toggle {
    font-family: 'Orbitron', monospace;
    font-size: 0.9rem;
    color: var(--accent);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0;
    font-weight: 700;
    text-shadow: 0 0 12px var(--accent-glow);
  }
  .build-order-toggle:hover { opacity: 0.8; }
  .build-order-toggle .chevron {
    display: inline-block;
    transition: transform 0.2s;
    font-size: 0.8rem;
  }
  .build-order-toggle .chevron.open { transform: rotate(90deg); }
  .build-order-empty { color: var(--text-dim); font-size: 0.85rem; font-style: italic; }
  .build-round {
    margin-bottom: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .build-round-header {
    background: var(--surface2);
    padding: 8px 14px;
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: flex;
    justify-content: space-between;
  }
  .build-round-slots { display: flex; }
  .build-slot {
    flex: 1;
    padding: 10px 14px;
    border-right: 1px solid var(--border);
    min-height: 42px;
    display: flex;
    align-items: center;
  }
  .build-slot:last-child { border-right: none; }
  .build-slot-empty { color: var(--text-dim); font-style: italic; font-size: 0.8rem; }
  .build-step { font-size: 0.85rem; }
  .build-step .step-name { color: var(--text-bright); font-weight: 600; }
  .build-step .step-level { color: var(--accent); font-family: 'Orbitron', monospace; font-size: 0.75rem; }
  .build-step .step-cost { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }

  /* Summary deficit display */
  .summary-card .deficit {
    font-family: 'Exo 2', sans-serif;
    font-size: 0.65rem;
    margin-top: 2px;
    font-weight: 400;
  }
  .deficit-ok { color: var(--success); }
  .deficit-short { color: var(--danger); }

  /* Inventory tab */
  .inv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .inv-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .inv-card .inv-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .inv-card .inv-source {
    font-size: 0.6rem;
    color: var(--text-dim);
    opacity: 0.6;
    margin-top: 4px;
  }
  .inv-card input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'Orbitron', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    -moz-appearance: textfield;
  }
  .inv-card input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
  .inv-card input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .inv-req { font-size: 0.7rem; margin-top: 6px; color: var(--text-dim); }
  .inv-req span { font-weight: 600; }
  .inv-req .short { color: var(--danger); }
  .inv-req .ok { color: var(--success); }

  /* Ghost add-hero panel */
  .ghost-card {
    background: transparent;
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-dim);
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .ghost-card:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(6,186,186,0.03);
  }

  /* Global save/load */
  .global-actions {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: flex;
    gap: 6px;
    z-index: 20;
  }
  .global-actions button {
    font-family: 'Exo 2', sans-serif;
    font-size: 0.7rem;
    padding: 6px 12px;
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.6;
  }
  .global-actions button:hover {
    opacity: 1;
    color: var(--accent);
    border-color: var(--accent);
  }
  .global-actions .save-flash {
    color: var(--success) !important;
    border-color: var(--success) !important;
    opacity: 1 !important;
  }
</style>
</head>
<body>

<div class="app-header">
  <h1><span class="brand-accent">Mecha Fire</span> Resource Calculator</h1>
  <p class="subtitle">Plan your upgrades across buildings, equipment, crystals &amp; heroes</p>
</div>

<div class="tab-bar" id="tab-bar">
  <button class="tab-btn active" onclick="switchTab('buildings')">Buildings</button>
  <button class="tab-btn" onclick="switchTab('warbringer')">Warbringer</button>
  <button class="tab-btn" onclick="switchTab('crystals')">Crystals</button>
  <button class="tab-btn" onclick="switchTab('heroes')">Hero Shards</button>
  <button class="tab-btn" onclick="switchTab('skills')">Hero Skills</button>
  <button class="tab-btn" onclick="switchTab('inventory')">Inventory</button>
</div>

<div class="global-actions">
  <button onclick="saveAll()" id="btn-save">Save</button>
  <button onclick="loadAll()">Load</button>
</div>

<!-- ═══════════════════════ BUILDINGS TAB ═══════════════════════ -->
<div class="tab-panel active" id="tab-buildings">
  <div class="summary" id="bld-summary"></div>
  <div class="actions">
    <button onclick="bldResetAll()">Reset All</button>
    <button onclick="bldSetAllTarget(35)">All Targets to 35</button>
    <label>Build Slots: <select id="slot-count" onchange="bldRecalc()"><option value="1">1</option><option value="2" selected>2</option></select></label>
  </div>
  <div class="card-grid" id="bld-grid"></div>
  <div class="build-order-section">
    <button class="build-order-toggle" onclick="toggleBuildOrder()">
      <span class="chevron" id="build-order-chevron">&#9654;</span> Build Order
    </button>
    <div id="build-order" style="display:none"></div>
  </div>
</div>

<!-- ═══════════════════════ WARBRINGER TAB ═══════════════════════ -->
<div class="tab-panel" id="tab-warbringer">
  <div class="summary" id="wb-summary"></div>
  <div class="actions">
    <button onclick="wbResetAll()">Reset All</button>
  </div>
  <div class="card-grid" id="wb-grid"></div>
</div>

<!-- ═══════════════════════ CRYSTALS TAB ═══════════════════════ -->
<div class="tab-panel" id="tab-crystals">
  <div class="summary" id="cry-summary"></div>
  <div class="actions">
    <button onclick="cryResetAll()">Reset All</button>
  </div>
  <div class="card-grid" id="cry-grid"></div>
</div>

<!-- ═══════════════════════ HERO SHARDS TAB ═══════════════════════ -->
<div class="tab-panel" id="tab-heroes">
  <div class="summary" id="hero-summary"></div>
  <div class="actions">
    <button onclick="heroResetAll()">Reset All</button>
  </div>
  <div class="card-grid" id="hero-grid"></div>
</div>

<!-- ═══════════════════════ HERO SKILLS TAB ═══════════════════════ -->
<div class="tab-panel" id="tab-skills">
  <div class="summary" id="skill-summary"></div>
  <div class="actions">
    <button onclick="skillResetAll()">Reset All</button>
  </div>
  <div class="card-grid" id="skill-grid"></div>
</div>

<!-- ═══════════════════════ INVENTORY TAB ═══════════════════════ -->
<div class="tab-panel" id="tab-inventory">
  <div class="summary" id="inv-summary"></div>
  <div class="inv-grid" id="inv-grid"></div>
</div>

<script>
// ══════════════════════════════════════════════════
//  TAB SYSTEM
// ══════════════════════════════════════════════════
function switchTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  // Find matching button
  const btns = document.querySelectorAll('.tab-btn');
  const names = ['buildings','warbringer','crystals','heroes','skills','inventory'];
  const idx = names.indexOf(id);
  if (idx >= 0) btns[idx].classList.add('active');
}

// ══════════════════════════════════════════════════
//  BUILDINGS TAB
// ══════════════════════════════════════════════════

  { name: "Defence Outpost", id: "defence-outpost", levels: {

  { name: "Cyborg Lab", id: "cyborg-lab", levels: {

  { name: "Rebirth Center", id: "rebirth-center", levels: {

function bldRecalc() {
  let tNeu=0,tUC=0,tDC=0,tBP=0,tUp=0;
  const blockers = new Set();
  const bd = BUILDINGS.map((b,i) => {
    const cur = +document.getElementById(`bld-cur-${i}`).value;
    const tgt = +document.getElementById(`bld-tgt-${i}`).value;
    let neu=0,uc=0,dc=0,bp=0,prs=[];
    if (tgt > cur) {
      for (let l = Math.max(cur+1,28); l <= tgt; l++) {
        const d = b.levels[l];
        if (d) { neu += d.neurotium||0; uc += d.unionCode||0; dc += d.defComp||0; bp += BLD_BP_PER_LVL;
          if (d.prereqs) d.prereqs.forEach(p => prs.push({...p, forLevel:l}));
        }
      }
    }
    return {cur,tgt,neu,uc,dc,bp,prs};
  });
  bd.forEach((d,i) => {
    const card = document.getElementById(`bld-card-${i}`);
    const costEl = document.getElementById(`bld-cost-${i}`);
    const prEl = document.getElementById(`bld-prereq-${i}`);
    card.classList.toggle("active", d.tgt > d.cur);
    let parts = [];
    if (d.neu) parts.push(`<span>${d.neu}</span> Neurotium`);
    if (d.uc) parts.push(`<span>${d.uc}</span> Union Code`);
    if (d.dc) parts.push(`<span>${d.dc}</span> Defense Components`);
    if (d.bp) parts.push(`<span>${d.bp}</span> Blueprints`);
    costEl.innerHTML = parts.join(" &middot; ");
    if (d.prs.length) {
      prEl.innerHTML = d.prs.map(p => {
        const di = BLD_ID_MAP[p.building], db = BUILDINGS[di];
        const dt = +document.getElementById(`bld-tgt-${di}`).value;
        const met = dt >= p.level;
        if (!met) blockers.add(di);
        return `<div class="prereq-line ${met?"prereq-met":"prereq-unmet"}" onclick="document.getElementById('bld-card-${di}').scrollIntoView({behavior:'smooth',block:'center'})" title="Jump to ${db.name}">
          <span class="prereq-indicator"></span><span>Lvl ${p.forLevel} needs ${db.name} ${p.level}${met?"":" (target: "+(dt<28?"< 28":dt)+")"}</span></div>`;
      }).join("");
    } else prEl.innerHTML = "";
    tNeu+=d.neu; tUC+=d.uc; tDC+=d.dc; tBP+=d.bp;
    if (d.tgt>d.cur) tUp += d.tgt - Math.max(d.cur,27);
  });
  BUILDINGS.forEach((_,i) => {
    document.getElementById(`bld-card-${i}`).classList.toggle("blocker", blockers.has(i));
  });

    ["Neurotium",tNeu,"neurotium","#9074C9"],["Union Code",tUC,"unionCode"],["Defense Components",tDC,"defComp","#F6EC98"],["Master Blueprints",tBP,"masterBlueprint","#67B6CD"]
  ]);

}

// Build order (unchanged logic)
function bldGetPrereqs(bid, level) {
  const b = BUILDINGS[BLD_ID_MAP[bid]], d = b.levels[level];
  if (d && d.prereqs && d.prereqs.length) return d.prereqs;
  if (bid !== "reactor-core") return [{building:"reactor-core",level}];
  return [];
}
function computeBuildOrder() {
  const sc = +el("slot-count").value;
  const steps = [];
  BUILDINGS.forEach((b,i) => {
    const cur = +el(`bld-cur-${i}`).value, tgt = +el(`bld-tgt-${i}`).value;
    if (tgt <= cur) return;
    for (let l=Math.max(cur+1,28); l<=tgt; l++) {
      const d=b.levels[l]||{};
      steps.push({key:`${b.id}@${l}`,buildingId:b.id,idx:i,name:b.name,level:l,neurotium:d.neurotium||0,unionCode:d.unionCode||0,defComp:d.defComp||0});
    }
  });
  if (!steps.length) return [];
  const sm={}; steps.forEach(s=>{sm[s.key]=s;});
  const deps={}; steps.forEach(s=>{
    deps[s.key]=new Set();
    const pk=`${s.buildingId}@${s.level-1}`; if(sm[pk]) deps[s.key].add(pk);
    bldGetPrereqs(s.buildingId,s.level).forEach(p=>{
      const dk=`${p.building}@${p.level}`; if(sm[dk]) deps[s.key].add(dk);
      const di=BLD_ID_MAP[p.building]; if(di!==undefined){const dc=+el(`bld-cur-${di}`).value;
        for(let l=Math.max(dc+1,28);l<=p.level;l++){const ck=`${p.building}@${l}`;if(sm[ck])deps[s.key].add(ck);}}
    });
  });
  const done=new Set(),rounds=[],rem=new Set(steps.map(s=>s.key));
  const bc={}; steps.forEach(s=>{bc[s.key]=0;}); steps.forEach(s=>{deps[s.key].forEach(d=>{if(bc[d]!==undefined)bc[d]++;});});
  while(rem.size){
    const ready=[]; rem.forEach(k=>{let ok=true;deps[k].forEach(d=>{if(!done.has(d))ok=false;});if(ok)ready.push(k);});
    if(!ready.length){const r=[];rem.forEach(k=>r.push(sm[k]));rounds.push(r);break;}
    ready.sort((a,b)=>(bc[b]||0)-(bc[a]||0)||sm[a].level-sm[b].level);
    const r=[];for(let i=0;i<Math.min(sc,ready.length);i++){r.push(sm[ready[i]]);done.add(ready[i]);rem.delete(ready[i]);}
    rounds.push(r);
  }
  return rounds;
}
function renderBuildOrder() {
  const c=document.getElementById("build-order"), sc=+el("slot-count").value, rounds=computeBuildOrder();
  if(!rounds.length){c.innerHTML='<div class="build-order-empty">Set target levels above to see the build order.</div>';return;}
  c.innerHTML=rounds.map((r,ri)=>{
    const slots=[];for(let s=0;s<sc;s++){const st=r[s];
      if(st){let cp=[];if(st.neurotium)cp.push(st.neurotium+" Neu");if(st.unionCode)cp.push(st.unionCode+" UC");if(st.defComp)cp.push(st.defComp+" DC");cp.push("10 BP");
        slots.push(`<div class="build-slot"><div class="build-step"><div><span class="step-name">${st.name}</span> <span class="step-level">${st.level-1} &rarr; ${st.level}</span></div><div class="step-cost">${cp.join(" &middot; ")}</div></div></div>`);
      }else slots.push(`<div class="build-slot"><span class="build-slot-empty">idle</span></div>`);
    }
    return `<div class="build-round"><div class="build-round-header"><span>Round ${ri+1}</span><span>${sc>1?sc+" slots":"1 slot"}</span></div><div class="build-round-slots">${slots.join("")}</div></div>`;
  }).join("");
}

  const eeCur = +el("hero-ee-cur").value, eeTgt = +el("hero-ee-tgt").value;

function skillRecalc() {
  const codexTotals = {};
  SKILL_CATS.forEach(cat => { if (!codexTotals[cat.codex]) codexTotals[cat.codex] = 0; });
  SKILL_CATS.forEach((cat,i) => {

    let books = 0;
    const starReqs = [];
    if (tgt > cur) {
      card.classList.add("active");
      for (let l = cur+1; l <= tgt; l++) {
        const d = SKILL_LEVELS[l-2];
        books += (cat.type === "omni" ? d.omni : d.regular) * cat.slots;
        if (d.starReq) starReqs.push(`Lvl ${l}: ${d.starReq}`);
      }
    } else card.classList.remove("active");
    const rarName = {R:"Rare",SR:"Epic",SSR:"Legendary"}[cat.rarity];
    costEl.innerHTML = books ? `<span>${books.toLocaleString()}</span> ${rarName} Skill Codex (${cat.name})` : "";
    noteEl.innerHTML = starReqs.length ? starReqs.map(s => `<span style="color:var(--gold)">${s}</span>`).join(" &middot; ") : "";
    codexTotals[cat.codex] += books;
  });
  el("skill-summary").innerHTML = summaryHTML([
    [`<span style="color:var(--rarity-r)">R</span> Exp`, codexTotals.codexRExp, "codexRExp", "var(--rarity-r)"],

    [`<span style="color:var(--rarity-sr)">SR</span> On-map`, codexTotals.codexSROnmap, "codexSROnmap", "var(--rarity-sr)"],
    [`<span style="color:var(--rarity-ssr)">SSR</span> Exp`, codexTotals.codexSSRExp, "codexSSRExp", "var(--rarity-ssr)"],
    [`<span style="color:var(--rarity-ssr)">SSR</span> On-map`, codexTotals.codexSSROnmap, "codexSSROnmap", "var(--rarity-ssr)"]
  ]);
}

function invGetStock(key) {
  const e = el(`inv-${key}`);
  return e ? (+e.value || 0) : 0;

// Gather total requirements across all tabs
function invGetRequirements() {
  const req = {};
  INV_CURRENCIES.forEach(c => { req[c.key] = 0; });
  // Buildings
  BUILDINGS.forEach((_,i) => {
    const cur = +el(`bld-cur-${i}`).value, tgt = +el(`bld-tgt-${i}`).value;
    if (tgt > cur) {
      const b = BUILDINGS[i];
      for (let l=Math.max(cur+1,28);l<=tgt;l++) {
        const d=b.levels[l]; if(!d) continue;
        req.neurotium += d.neurotium||0;
        req.unionCode += d.unionCode||0;
        req.defComp += d.defComp||0;
        req.masterBlueprint += BLD_BP_PER_LVL;
      }
    }
  });
  // Warbringer
  WB_SLOTS.forEach((s,i) => {
    const cur=+el(`wb-cur-${i}`).value, tgt=+el(`wb-tgt-${i}`).value;
    const firstIdx=WB_TIERS.indexOf(s.firstTier);
    if (tgt>cur) for(let ti=cur+1;ti<=tgt;ti++){
      if(ti<firstIdx) continue;
      const costs=WB_COSTS_COMMON[WB_TIERS[ti]];
      if(costs){req.quantumCube+=costs[0];req.fusionModule+=costs[1];req.controlKnob+=costs[2];}
    }
  });
  // Crystals
  CRY_SLOTS.forEach((_,i) => {
    const cur=+el(`cry-cur-${i}`).value, tgt=+el(`cry-tgt-${i}`).value;
    if(tgt>cur) for(let l=cur+1;l<=tgt;l++){const d=CRY_LEVELS[l-1];req.crystalAmp+=d.amp;req.cosmicGem+=d.gem;}
  });
  // Hero EE
  const eeCur=+el("hero-ee-cur").value, eeTgt=+el("hero-ee-tgt").value;
  if(eeTgt>eeCur) for(let l=eeCur+1;l<=eeTgt;l++) req.exclEquip+=HERO_EE_COST[l-1];
  // Hero shards
  heroGetAll().forEach(h => {
    if(h.tgt>h.cur){ const key="shards"+h.rarity; for(let p=h.cur;p<h.tgt;p++) req[key]+=HERO_SHARD_COSTS[p]; }
  });
  // Skills
  SKILL_CATS.forEach((cat,i) => {
    const cur=+el(`skill-cur-${i}`).value, tgt=+el(`skill-tgt-${i}`).value;
    if(tgt>cur) for(let l=cur+1;l<=tgt;l++){const d=SKILL_LEVELS[l-2];req[cat.codex]+=(cat.type==="omni"?d.omni:d.regular)*cat.slots;}
  });
  return req;
}

function invRecalc() {
  const req = invGetRequirements();
  let shortCount = 0;
  INV_CURRENCIES.forEach(c => {
    const stock = invGetStock(c.key);
    const need = req[c.key];
    const diff = stock - need;
    const reqEl = el(`inv-req-${c.key}`);
    if (need === 0) {
      reqEl.innerHTML = "";
    } else if (diff >= 0) {
      reqEl.innerHTML = `Need <span>${need.toLocaleString()}</span> &mdash; <span class="ok">surplus ${diff.toLocaleString()}</span>`;
    } else {
      reqEl.innerHTML = `Need <span>${need.toLocaleString()}</span> &mdash; <span class="short">short ${Math.abs(diff).toLocaleString()}</span>`;
      shortCount++;
    }
  });
  el("inv-summary").innerHTML = "";
  // Refresh tab summaries to show updated deficits
  // Use a flag to avoid infinite recursion
  if (!invRecalc._updating) {
    invRecalc._updating = true;
    bldRecalc(); wbRecalc(); cryRecalc(); heroRecalc(); skillRecalc();
    invRecalc._updating = false;
  }
}

//  SHARED UTILITIES

function el(id) { return document.getElementById(id); }
function optRange(min, max, sel, fmt) {
  let h = "";
  for (let v=min;v<=max;v++) h += `<option value="${v}" ${v===sel?"selected":""}>${fmt?fmt(v):v}</option>`;
  return h;
}
function summaryCard(label, value, stockKey, color) {
  const num = typeof value === "number" ? value : 0;
  let deficitHtml = "";
  if (stockKey && num > 0) {
    const stock = invGetStock(stockKey);
    const diff = stock - num;
    if (diff >= 0) {
      deficitHtml = `<div class="deficit deficit-ok">+${diff.toLocaleString()} surplus</div>`;
    } else {
      deficitHtml = `<div class="deficit deficit-short">${diff.toLocaleString()} short</div>`;
    }
  }
  const style = color ? ` style="--card-color:${color}"` : "";
  const valStyle = color ? ` style="color:${color};text-shadow:0 0 12px ${color}60"` : "";
  return `<div class="summary-card"${style}><div class="label">${label}</div><div class="value"${valStyle}>${typeof value==="number"?value.toLocaleString():value}</div>${deficitHtml}</div>`;
}
function summaryHTML(items) {
  // items: [label, value, stockKey?, color?]
  return items.map(item => summaryCard(item[0], item[1], item[2], item[3])).join("");
}

// ══════════════════════════════════════════════════
function saveAll() {
  const inv = {};
  INV_CURRENCIES.forEach(c => { inv[c.key] = el(`inv-${c.key}`).value; });
  const state = {
    buildings: BUILDINGS.map((_,i) => ({ cur: el(`bld-cur-${i}`).value, tgt: el(`bld-tgt-${i}`).value })),
    slots: el("slot-count").value,
    warbringer: WB_SLOTS.map((_,i) => ({ cur: el(`wb-cur-${i}`).value, tgt: el(`wb-tgt-${i}`).value })),
    crystals: CRY_SLOTS.map((_,i) => ({ cur: el(`cry-cur-${i}`).value, tgt: el(`cry-tgt-${i}`).value })),
    heroEE: { cur: el("hero-ee-cur").value, tgt: el("hero-ee-tgt").value },
    heroes: heroGetAll().map(h => ({ name: h.name, cur: String(h.cur), tgt: String(h.tgt) })),
    skills: SKILL_CATS.map((_,i) => ({ cur: el(`skill-cur-${i}`).value, tgt: el(`skill-tgt-${i}`).value })),
    inventory: inv
  };
  localStorage.setItem("mechafire-state", JSON.stringify(state));
  const btn = el("btn-save");
  btn.classList.add("save-flash"); btn.textContent = "Saved";
  setTimeout(() => { btn.classList.remove("save-flash"); btn.textContent = "Save"; }, 1200);
}
function loadAll() {
  // Try new key first, fall back to old key
  let raw = localStorage.getItem("mechafire-state") || localStorage.getItem("mechafire-buildings");
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    const blds = Array.isArray(s) ? s : s.buildings;
    if (blds) blds.forEach((b,i) => { if(i<BUILDINGS.length){el(`bld-cur-${i}`).value=b.cur;el(`bld-tgt-${i}`).value=b.tgt;} });
    if (s.slots) el("slot-count").value = s.slots;
    if (s.warbringer) s.warbringer.forEach((w,i) => { if(i<WB_SLOTS.length){el(`wb-cur-${i}`).value=w.cur;el(`wb-tgt-${i}`).value=w.tgt;} });
    if (s.crystals) s.crystals.forEach((c,i) => { if(i<CRY_SLOTS.length){el(`cry-cur-${i}`).value=c.cur;el(`cry-tgt-${i}`).value=c.tgt;} });
    if (s.heroEE) { el("hero-ee-cur").value=s.heroEE.cur; el("hero-ee-tgt").value=s.heroEE.tgt; }
    if (s.heroes && s.heroes.length) {
      // Remove default hero cards before loading saved ones
      heroGetAll().forEach(h => { const c=el(`hero-card-${h.idx}`); if(c)c.remove(); });
      s.heroes.forEach(h => { heroAddHero(h.name, +h.cur, +h.tgt); });
      heroEnsureGhost();
    }
    if (s.skills) s.skills.forEach((k,i) => { if(i<SKILL_CATS.length){el(`skill-cur-${i}`).value=k.cur;el(`skill-tgt-${i}`).value=k.tgt;} });
    if (s.inventory) INV_CURRENCIES.forEach(c => { const e=el(`inv-${c.key}`); if(e && s.inventory[c.key]!==undefined) e.value=s.inventory[c.key]; });
    bldRecalc(); wbRecalc(); cryRecalc(); heroRecalc(); skillRecalc(); invRecalc();
  } catch(e) {}
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
document.addEventListener("DOMContentLoaded", () => {
  bldBuildUI();
  wbBuildUI();
  cryBuildUI();
  heroBuildUI();
  skillBuildUI();
  invBuildUI();
  loadAll();
});
</script>
</body>
</html>
